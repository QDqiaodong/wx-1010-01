server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:icepark_test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6448

logging:
  level:
    com.icepark: WARN
    org.hibernate.SQL: WARN
