services:
  mysql:
    image: ${DOCKER_REGISTRY:-}mysql:8.0
    container_name: wx-1010-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-log-bin
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-icepark}
      MYSQL_USER: ${MYSQL_USER:-icepark}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-icepark}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: ${DOCKER_REGISTRY:-}redis:7-alpine
    container_name: wx-1010-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
    container_name: wx-1010-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    environment:
      SERVER_PORT: ${BACKEND_PORT:-8080}
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:mysql://${COMPOSE_PROJECT_NAME}-mysql:3306/${MYSQL_DATABASE:-icepark}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-icepark}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-icepark}
      SPRING_DATA_REDIS_HOST: ${COMPOSE_PROJECT_NAME}-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_REDIS_HOST: ${COMPOSE_PROJECT_NAME}-redis
      SPRING_REDIS_PORT: 6379
      SERVER_SERVLET_ENCODING_CHARSET: UTF-8
      SERVER_SERVLET_ENCODING_ENABLED: "true"
      SERVER_SERVLET_ENCODING_FORCE: "true"
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
    container_name: wx-1010-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:

networks:
  default:
    ipam:
      config:
        - subnet: 10.70.10.0/24
